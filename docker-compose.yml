version: '3.8'

networks:
  blog-app:
    driver: bridge
services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    
    environment:
      APP_NAME: Laravel
      APP_ENV: local

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_blog
      DB_USERNAME: root
      DB_PASSWORD: db_password

    entrypoint: /bin/bash /var/www/html/entrypoint.sh
    
    networks:
      - blog-app
volumes:
  db_data:
